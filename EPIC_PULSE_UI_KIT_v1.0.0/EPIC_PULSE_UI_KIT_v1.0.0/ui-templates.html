<!DOCTYPE html>
<html lang="en" data-ep-manual-boot>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPIC Pulse — UI templates</title>
<meta name="description" content="Every element in the EPIC Pulse UI kit: what it looks like, what governs it, and the markup to copy.">
<link rel="icon" href="ui-kit/assets/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="ui-kit/css/ep-fonts.css">
<link rel="stylesheet" href="ui-kit/css/ep-tokens.css">
<link rel="stylesheet" href="ui-kit/css/ep-reset.css">
<link rel="stylesheet" href="ui-kit/css/ep-base.css">
<link rel="stylesheet" href="ui-kit/css/ep-controls.css">
<link rel="stylesheet" href="ui-kit/css/ep-surfaces.css">
<link rel="stylesheet" href="ui-kit/css/ep-data.css">
<link rel="stylesheet" href="ui-kit/css/ep-shell.css">
<link rel="stylesheet" href="ui-kit/css/ep-overlays.css">
<link rel="stylesheet" href="ui-kit/css/ep-screens.css">
<link rel="stylesheet" href="ui-kit/css/ep-auth.css">
<link rel="stylesheet" href="ui-kit/css/ep-extended.css">
<script>
/* Guard 6. The kit keys its preferences 'epic-pulse.*'; this page shares an
   origin with the example project, so without a prefix of its own a rail
   toggle inside a preview would collapse the sidebar in the application. Read
   by ep-theme.js as it parses, which is why it is set here and not in init(). */
window.EP_STORAGE_PREFIX = 'epic-pulse-docs.';
</script>
<script src="ui-kit/js/ep-theme.js"></script>

<style>
/* Page furniture. Everything here is dx-, never ep-, and none of it appears in
   a snippet: what you copy off this page is the kit and nothing else. It is
   painted with the kit's own tokens so it follows the theme you pick. */

.dx-top,
.dx-shell,
.dx-side,
.dx-main { font-family: var(--ep-font-exo); }

body {
  margin: 0;
  background: var(--ep-surface-app);
  color: var(--ep-text-body);
}

/* ---------- brand plate ----------
   The product's own brand gradient, the same one the sidebar and the auth
   panel carry, so the reference page reads as part of Pulse rather than as a
   document about it. It does not flip with the theme, for the same reason
   those two surfaces do not. */

.dx-top {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: var(--ep-space-4);
  flex-wrap: wrap;
  padding: 11px var(--ep-space-5);
  background: var(--ep-brand-gradient-header);
  border-bottom: 1px solid var(--ep-border-subtle);
}

.dx-top__logo { height: 21px; width: auto; display: block; }

.dx-top__divider { width: 1px; height: 24px; background: rgba(255, 255, 255, .24); }

.dx-top__names { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.dx-top__title {
  margin: 0;
  font-size: 13.5px;
  font-weight: var(--ep-weight-bold);
  letter-spacing: .2px;
  color: var(--ep-text-on-dark);
  white-space: nowrap;
}

.dx-top__sub {
  font-size: 10.5px;
  color: rgba(255, 255, 255, .62);
  white-space: nowrap;
}

.dx-top__right { margin-left: auto; display: flex; align-items: center; gap: var(--ep-space-3); }

.dx-top__version {
  font-size: 10.5px;
  font-weight: var(--ep-weight-bold);
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: var(--ep-radius-pill);
  color: rgba(255, 255, 255, .78);
  background: rgba(255, 255, 255, .12);
  white-space: nowrap;
}

/* The filter carries its own glyph rather than a floating label: on a brand
   plate there is no second line to put one on. */
.dx-search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 244px;
  max-width: 38vw;
  padding: 6px 11px;
  border-radius: var(--ep-radius-pill);
  border: 1px solid rgba(255, 255, 255, .22);
  background: rgba(255, 255, 255, .11);
  color: rgba(255, 255, 255, .7);
}

.dx-search svg { flex: 0 0 auto; }

.dx-filter {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 12px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--ep-text-on-dark);
}

.dx-filter:focus { outline: none; }
.dx-filter::placeholder { color: rgba(255, 255, 255, .55); }

.dx-theme {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: var(--ep-radius-pill);
  background: rgba(255, 255, 255, .12);
}

.dx-theme button {
  font: inherit;
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  padding: 4px 10px;
  border: 0;
  border-radius: var(--ep-radius-pill);
  background: transparent;
  color: rgba(255, 255, 255, .72);
  cursor: pointer;
}

.dx-theme button[aria-pressed="true"] {
  background: var(--ep-text-on-dark);
  color: var(--ep-paper-brand);
}

.dx-shell {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  align-items: start;
  gap: var(--ep-space-6);
  padding: var(--ep-space-6) var(--ep-space-5);
  max-width: 1560px;
  margin: 0 auto;
}

.dx-side {
  position: sticky;
  top: 76px;
  max-height: calc(100vh - 96px);
  overflow: auto;
  padding-right: var(--ep-space-2);
}

.dx-side__head {
  font-size: 10.5px;
  font-weight: var(--ep-weight-bold);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ep-text-muted);
  margin: 0 0 var(--ep-space-3);
}

.dx-side a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--ep-space-2);
  padding: 6px 9px;
  border-left: 2px solid transparent;
  border-radius: 0 var(--ep-radius-sm) var(--ep-radius-sm) 0;
  font-size: 12.5px;
  color: var(--ep-text-body);
  text-decoration: none;
}

.dx-side a:hover { background: var(--ep-surface-inset); }

/* Which section you are reading, tracked by the scroll rather than by the last
   link clicked — the page is one long document and most of it is reached by
   scrolling past the nav, not through it. */
.dx-side a[aria-current="true"] {
  border-left-color: var(--ep-accent-primary);
  background: var(--ep-surface-inset);
  color: var(--ep-accent-primary);
  font-weight: var(--ep-weight-bold);
}

.dx-side__count {
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-muted);
  font-variant-numeric: tabular-nums;
}

.dx-main { min-width: 0; }

/* ---------- lede ----------
   What this page is and how to read it, before the first component. Somebody
   arriving from a handover email has no other way to find that out. */

.dx-lede {
  max-width: 84ch;
  margin-bottom: var(--ep-space-7);
}

.dx-lede h1 {
  margin: 0 0 var(--ep-space-3);
  font-size: 27px;
  line-height: 1.15;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-heading);
}

.dx-lede p {
  margin: 0 0 var(--ep-space-3);
  font-size: 13px;
  line-height: var(--ep-leading-normal);
  color: var(--ep-text-body);
}

.dx-lede strong { color: var(--ep-text-heading); font-weight: var(--ep-weight-bold); }

.dx-lede code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .92em;
  padding: 1px 5px;
  border-radius: var(--ep-radius-sm);
  background: var(--ep-surface-inset);
  color: var(--ep-text-heading);
}

.dx-lede__meta { display: flex; flex-wrap: wrap; gap: var(--ep-space-2); margin-top: var(--ep-space-4); }

.dx-lede__chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: var(--ep-radius-pill);
  border: 1px solid var(--ep-border-subtle);
  background: var(--ep-surface-card);
  color: var(--ep-text-muted);
}

.dx-lede__chip b {
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-heading);
  font-variant-numeric: tabular-nums;
}

.dx-section { margin-bottom: var(--ep-space-8); scroll-margin-top: 76px; }

/* The note sits on the heading line rather than under it: at ten sections a
   reader scanning for one of them is reading titles, and a paragraph between
   each title and the first card doubles the distance between them. */
.dx-section__head {
  display: flex;
  align-items: baseline;
  gap: var(--ep-space-3);
  flex-wrap: wrap;
  padding-bottom: var(--ep-space-3);
  border-bottom: 1px solid var(--ep-border-strong);
  margin-bottom: var(--ep-space-4);
}

.dx-section__num {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-on-accent);
  background: var(--ep-accent-fill);
  border-radius: var(--ep-radius-sm);
  padding: 2px 7px;
  font-variant-numeric: tabular-nums;
}

.dx-section__title {
  margin: 0;
  flex: 0 0 auto;
  font-size: 20px;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-heading);
}

.dx-section__note {
  margin: 0;
  flex: 1;
  min-width: 280px;
  font-size: 12px;
  line-height: var(--ep-leading-normal);
  color: var(--ep-text-muted);
}

.dx-entry {
  border: 1px solid var(--ep-border-subtle);
  border-radius: var(--ep-radius-lg);
  background: var(--ep-surface-card);
  margin-bottom: var(--ep-space-5);
  overflow: hidden;
  scroll-margin-top: 76px;
}

/* Two rows, not two columns. The chips belong beside the title because both
   name the thing; the note is prose about it and wants the whole width. Split
   left/right, the note was boxed into whatever the chips left over — a
   four-chip entry read at a different measure from a one-chip entry, for a
   reason that has nothing to do with what it says. */
.dx-entry__head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: var(--ep-space-4) var(--ep-space-4) var(--ep-space-3);
}

/* the identifying row: what it is called, and what it needs */
.dx-entry__headrow {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--ep-space-4);
}

.dx-entry__id { flex: 1; min-width: 0; }

.dx-entry__title {
  margin: 0;
  font-size: 14.5px;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-heading);
}

.dx-entry__note {
  margin: 0;
  font-size: 12.5px;
  line-height: var(--ep-leading-normal);
  color: var(--ep-text-muted);
}

.dx-entry__actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--ep-space-2);
  flex: 0 0 auto;
}

.dx-files { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }

.dx-file {
  font-size: 10.5px;
  font-weight: var(--ep-weight-bold);
  padding: 3px 8px;
  border-radius: var(--ep-radius-pill);
  color: var(--ep-text-muted);
  background: var(--ep-surface-inset);
  white-space: nowrap;
}

/* A file chip says where the rules live; a mount chip says what the page has
   to carry or the component never appears. Different kind of fact, so it is
   not left to read as one more grey pill. */
.dx-file--mount {
  color: var(--ep-accent-primary);
  background: color-mix(in oklab, var(--ep-accent-primary) 10%, transparent);
  font-family: var(--ep-font-mono, ui-monospace, monospace);
}

/* ---------- preview stage ----------
   transform makes the stage a containing block, so anything the list below
   misses still resolves inside the card instead of escaping onto the page. */

.dx-stage {
  position: relative;
  transform: translateZ(0);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ep-space-3);
  padding: var(--ep-space-4);
  border-top: 1px solid var(--ep-border-subtle);
  background: var(--ep-surface-app);
  overflow: auto;
}

.dx-stage--block   { display: block; }
.dx-stage--stack   { flex-direction: column; align-items: stretch; }
.dx-stage--panel   { background: var(--ep-surface-card); }
.dx-stage--sunken  { background: var(--ep-surface-inset); }
.dx-stage--flush   { padding: 0; }
.dx-stage--pad-lg  { padding: var(--ep-space-6); }
.dx-stage--center  { justify-content: center; }
.dx-stage--top     { align-items: flex-start; }
.dx-stage--popper  { overflow: visible; }

/* A popper is taller than a short stage and clipping it is not how it behaves
   on a screen, so the card releases its own clip too and the code block below
   takes over rounding the bottom corners. */
.dx-entry:has(.dx-stage--popper) { overflow: visible; }
.dx-entry:has(.dx-stage--popper) .dx-code-block {
  border-bottom-left-radius: var(--ep-radius-lg);
  border-bottom-right-radius: var(--ep-radius-lg);
}

/* Containment. These components resolve against the viewport in the app, which
   inside a preview card means they escape it and cover the page. Re-anchoring
   them to the stage is what lets them be looked at. The stage is position:
   relative, so absolute is enough — nothing else about them changes.

   .ep-topbar is deliberately NOT in this list. It is sticky and already in
   flow, so it needs no rescuing; forcing it to absolute took it out of its
   column and left width:100% resolving against the stage instead, which is
   wider by the whole sidebar. Only put something here if it is fixed. */

.dx-stage .ep-scrim,
.dx-stage .ep-drawer,
.dx-stage .ep-assistant,
.dx-stage .ep-fab-dock,
.dx-stage .ep-toast-dock,
.dx-stage .ep-popover-layer,
.dx-stage .ep-menu-layer { position: absolute; }

/* The sidebar is the exception, and scoping it is the whole point. Above
   1024px it is sticky and in flow — it needs no rescuing, and taking it out of
   flow collapses the app frame's flex row, so the topbar renders underneath it
   with its crumb and title hidden. Below 1024px it is genuinely fixed and
   off-canvas, which is the case worth containing. A standalone sidebar preview
   is contained either way, because it is the only thing in its card. */
@media (max-width: 1023px) {
  .dx-stage .ep-sidebar,
  .dx-stage .ep-sidebar__backdrop { position: absolute; }
}

/* It is 100vh tall at every width, which no card is. Flattened so a closed
   sidebar is still visible in its own. Wrong for any preview whose open/close
   toggle is real — that is what --live restores. */
.dx-stage .ep-sidebar { height: auto; transform: none; }
.dx-stage .ep-sidebar__backdrop { position: absolute; }

.dx-stage--live .ep-sidebar { transform: translateX(-100%); }
.dx-stage--live .ep-sidebar.ep-is-open { transform: none; }

/* The app frame is a flex item in the stage, and left to itself it is sized by
   its contents in BOTH directions — which is wrong in both. Its min-width is
   auto, so it could not shrink below the topbar's widest layout and ran 86px
   past the card, clipping the last control off the bar; and it never grew
   either, so on a wide screen it stopped short of the right edge while
   --top kept it short of the bottom one. A frame is the room its screen sits
   in: it takes the whole card, and the sidebar takes the whole height with it. */
.dx-stage .ep-app {
  flex: 1 1 auto;
  min-width: 0;
  align-self: stretch;   /* beats --top, which would leave it content-tall */
}

/* And the topbar's own breakpoints answer to the WINDOW, not to this card, so
   at card width it keeps every desktop control at its full size and overflows
   by the difference. The search field is the one part that can give the room
   back; on a real screen this narrow a media query would have dropped it
   entirely. Only the preview is affected — the kit's own rule is untouched. */
.dx-stage .ep-topbar__search { min-width: 0; flex: 0 1 auto; }

/* Docked chrome sits at the viewport edge. Inside a stage the same offsets read
   as a large hole, so they are pulled in to the stage's own edge. */
.dx-stage .ep-fab-dock,
.dx-stage .ep-toast-dock { right: 16px; bottom: 16px; }

/* The dock is 380px wide in the product. Shrinking it to whatever the card
   has spare would show a toast nobody will ever see, so only the cap moves. */
.dx-stage .ep-toast-dock { max-width: calc(100% - 32px); }

/* The assistant is 676px tall and docked to the bottom of the viewport. In a
   card that puts its head off the top edge, so it fills the card instead —
   the same reasoning as the drawer below. */
.dx-stage .ep-assistant { right: 16px; bottom: 16px; top: 16px; height: auto; }

/* A whole-screen assembly sizes itself against the viewport. Inside a preview
   card the card is the viewport, so the floor comes off — the same reasoning as
   the fixed-position chrome above. */
.dx-stage .ep-auth,
.dx-stage .ep-page,
.dx-stage .ep-app { min-height: 0; }

/* The drawer is 100vh tall because it is a full-height panel. In a card the
   card is the height it should fill. */
.dx-stage .ep-drawer { height: 100%; }

.dx-stage__scenery {
  position: absolute;
  inset: 0;
  padding: var(--ep-space-4);
  opacity: .5;
  pointer-events: none;
  overflow: hidden;
}

.dx-stage__scenery + * { position: relative; }

/* A dialog shown as a specimen rather than opened. The scrim stops covering
   the card and takes its place in the flow, so several can be read at once —
   for an entry whose subject is the set rather than any one of them. */
.dx-stage--specimen .ep-scrim {
  position: static;
  opacity: 1;
  pointer-events: auto;
  border-radius: var(--ep-radius-md);
  padding: var(--ep-space-5);
}

.dx-stage--specimen .ep-scrim--right { align-items: stretch; justify-content: center; }
.dx-stage--specimen .ep-drawer { height: auto; }

/* An anchored surface has no anchor here, and two of them absolutely
   positioned in one card land on top of each other. Flattened by the stage
   rather than by an inline style in the markup: a position override written
   into a snippet is a page-fitting decision a reader would copy. */
.dx-stage--specimen .ep-popover-layer,
.dx-stage--specimen .ep-menu-layer { position: static; inset: auto; }

.dx-stage--specimen .ep-popover,
.dx-stage--specimen .ep-pop { position: static; }

/* ---------- specimen groups ----------
   Several variants of one element, each band under its own caption, so the
   entry answers "which one is which" without a reader counting positions.
   The caption is page furniture and the band bodies are the entry's markup:
   what gets copied is the markup, with the caption carried as a comment. */

.dx-groups { display: flex; flex-direction: column; gap: var(--ep-space-5); width: 100%; }

.dx-group { display: flex; flex-direction: column; gap: var(--ep-space-3); min-width: 0; }

/* Not uppercased: most captions here are class names, and a class name that
   is not written the way it is typed is a class name a reader has to
   translate before they can use it. */
.dx-caption {
  display: flex;
  align-items: baseline;
  gap: var(--ep-space-2);
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  letter-spacing: .01em;
  color: var(--ep-text-heading);
}

.dx-caption::before {
  content: "";
  width: 14px;
  height: 2px;
  border-radius: 2px;
  background: var(--ep-accent-primary);
  flex: 0 0 auto;
}

.dx-caption__hint {
  /* the kit's muted token rather than a grey of this page's own: it is the
     one the gate measures against every ground, in both themes, so a hint
     cannot drift below AA the way a hand-picked value did */
  color: var(--ep-text-muted);
  font-size: 10.5px;
  font-weight: var(--ep-weight-regular);
  letter-spacing: 0;
  text-transform: none;
}

/* How a band lays its own specimens out. A band is never the component — it is
   the tray the component sits on — so these three are the only arrangements. */
.dx-group__body { min-width: 0; }
.dx-group__body--row  { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ep-space-3); }
.dx-group__body--col  { display: flex; flex-direction: column; align-items: stretch; gap: var(--ep-space-3); }
.dx-group__body--grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: var(--ep-space-3); }
.dx-group__body--block { display: block; }

/* ---------- code block ----------
   One region at the foot of the card: the tabs, what the selected tab is worth
   and the copy button all sit on the same line, so a reader never has to look
   in two places to find out whether something is copyable. */

.dx-code-block {
  border-top: 1px solid var(--ep-border-subtle);
  background: var(--ep-surface-inset);
}

.dx-tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
  padding: 0 var(--ep-space-4);
  border-bottom: 1px solid var(--ep-border-subtle);
}

/* The tabs are their own element because a tablist may contain nothing but
   tabs — the line count and the copy button share the row, not the role. */
.dx-tabs__list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
}

.dx-tab {
  font: inherit;
  font-size: 10.5px;
  font-weight: var(--ep-weight-bold);
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 9px 11px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ep-text-muted);
  cursor: pointer;
}

.dx-tab:hover { color: var(--ep-text-heading); }

.dx-tab[aria-selected="true"] {
  color: var(--ep-accent-primary);
  border-bottom-color: var(--ep-accent-primary);
}

/* A reference tab says so in its own label rather than in a badge beside it:
   the label is what a reader reads before they click, and the badge was one
   more thing to notice. */
.dx-tab--ref[aria-selected="true"] {
  color: var(--ep-text-heading);
  border-bottom-color: var(--ep-border-strong);
}

.dx-tabs__end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--ep-space-3);
  padding-left: var(--ep-space-3);
}

.dx-lines {
  font-size: 10.5px;
  color: var(--ep-text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.dx-copy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  padding: 4px 10px;
  border-radius: var(--ep-radius-md);
  border: 1px solid var(--ep-border-strong);
  background: var(--ep-surface-card);
  color: var(--ep-text-body);
  cursor: pointer;
  white-space: nowrap;
}

.dx-copy:hover { border-color: var(--ep-accent-primary); color: var(--ep-accent-primary); }
.dx-copy[hidden] { display: none; }

/* The kit's own glyphs, carried by the page's chrome. */
.dx-glyph { display: inline-flex; flex: 0 0 auto; }
.dx-glyph svg { display: block; }
.dx-copy--done { border-color: var(--ep-status-positive); color: var(--ep-status-positive); }

.dx-panel { display: none; }
.dx-panel[data-dx-open] { display: block; }

/* The notice travels inside the pane, above the code it is about, so switching
   tabs cannot leave it stranded over the wrong snippet. */
.dx-panel__bar {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px var(--ep-space-4);
  background: var(--ep-surface-card);
  border-bottom: 1px solid var(--ep-border-subtle);
}


.dx-notice {
  flex: 1;
  margin: 0;
  font-size: 11.5px;
  line-height: var(--ep-leading-normal);
  color: var(--ep-text-muted);
}

.dx-notice b { font-weight: var(--ep-weight-bold); color: var(--ep-text-body); }

.dx-code {
  margin: 0;
  padding: var(--ep-space-4);
  max-height: 460px;
  overflow: auto;
  font-size: 12px;
  line-height: 1.55;
  tab-size: 2;
}

.dx-code code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  white-space: pre;
  color: var(--ep-text-body);
}

/* ---------- launch ----------
   A dialog is judged at the size it really opens. Where an entry carries more
   than one, there is one button per dialog and each says which — a single
   Launch would silently mean "the first one". */

.dx-launches { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }

.dx-launch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-size: 11px;
  font-weight: var(--ep-weight-bold);
  padding: 4px 10px;
  border-radius: var(--ep-radius-md);
  border: 1px solid var(--ep-accent-primary);
  background: transparent;
  color: var(--ep-accent-primary);
  cursor: pointer;
  white-space: nowrap;
}

.dx-launch:hover { background: var(--ep-accent-primary); color: var(--ep-text-on-accent); }

/* One mark, in both places: on the button that opens a dialog at full size,
   and on every control inside a preview that opens one. A reader can tell at a
   glance which things in a preview lead somewhere, and that it is the same
   somewhere the Launch button goes. It is never put on a control that opens an
   anchored panel — those carry their own caret, and a second glyph beside it
   reads as a second affordance. */
.dx-launch::before,
.dx-trigger::after { content: "\2922"; font-weight: var(--ep-weight-regular); }
.dx-launch::before { margin-right: 6px; }

.dx-trigger::after {
  margin-left: 6px;
  opacity: .6;
  font-size: .9em;
}

/* Where an intercepted navigation is reported. Without somewhere visible to
   put it, a swallowed click is indistinguishable from a dead control. */
.dx-intent {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 90;
  max-width: 420px;
  padding: 9px 13px;
  border-radius: var(--ep-radius-md);
  border: 1px solid var(--ep-border-strong);
  background: var(--ep-surface-card);
  color: var(--ep-text-body);
  font-size: 12px;
  box-shadow: var(--ep-shadow-card);
}

.dx-intent[hidden] { display: none; }
.dx-intent b { font-weight: var(--ep-weight-bold); }

.dx-empty {
  padding: var(--ep-space-5);
  border: 1px dashed var(--ep-border-strong);
  border-radius: var(--ep-radius-md);
  font-size: 12.5px;
  color: var(--ep-text-muted);
}

.dx-flag {
  margin: 0;
  padding: var(--ep-space-3) var(--ep-space-4);
  font-size: 12px;
  font-weight: var(--ep-weight-bold);
  color: var(--ep-text-on-accent);
  background: var(--ep-status-negative);
}

.dx-specimens {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ep-space-3);
}

.dx-specimen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 92px;
  padding: var(--ep-space-3) 4px;
  border: 1px solid var(--ep-border-subtle);
  border-radius: var(--ep-radius-md);
  background: var(--ep-surface-card);
  color: var(--ep-text-body);
}

.dx-specimen__name {
  font-size: 10px;
  color: var(--ep-text-muted);
  word-break: break-all;
  text-align: center;
}

.dx-specimen__box {
  width: 100%;
  height: 46px;
  background: var(--ep-surface-inset);
  border: 1px solid var(--ep-border-subtle);
}

.dx-scale { display: flex; flex-direction: column; gap: var(--ep-space-3); width: 100%; }

.dx-scale__row {
  display: flex;
  align-items: baseline;
  gap: var(--ep-space-4);
  padding-bottom: var(--ep-space-2);
  border-bottom: 1px solid var(--ep-border-subtle);
}

.dx-scale__name {
  flex: 0 0 190px;
  font-size: 11px;
  color: var(--ep-text-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.dx-scale__sample { color: var(--ep-text-head); min-width: 0; }

.dx-specimen__swatch {
  width: 100%;
  height: 34px;
  border-radius: var(--ep-radius-sm);
  border: 1px solid var(--ep-border-subtle);
}

@media (max-width: 980px) {
  .dx-shell { grid-template-columns: minmax(0, 1fr); }
  .dx-side { position: static; max-height: none; }
  .dx-top__names { display: none; }
}

<script>
/* The registry. Sections and entries are data, declared below and rendered
   once; nothing on this page is hand-written markup for a component. */
(function (global) {
  'use strict';

  var DX = { sections: [], deferred: [], flags: [], intents: [], openScrim: null,
             restore: null, shellBoot: null };

  /* Declare a section. Entries may be given here or added later by dxAdd, so a
     component can be documented beside the components it is used with rather
     than beside the file it happens to live in. */
  function dxSection(section) {
    section.entries = section.entries || [];
    DX.sections.push(section);
    return section;
  }

  function dxAdd(sectionId, item, at) {
    var i, s = null;
    for (i = 0; i < DX.sections.length; i++) {
      if (DX.sections[i].id === sectionId) { s = DX.sections[i]; break; }
    }
    if (!s) {
      DX.flags.push('dxAdd: no section "' + sectionId + '" for entry "' + (item && item.id) + '"');
      return null;
    }
    if (typeof at === 'number' && at >= 0 && at <= s.entries.length) { s.entries.splice(at, 0, item); }
    else { s.entries.push(item); }
    return item;
  }

  /* Anything needing the kit itself — the icon set, a rendered shell — cannot
     run while the page is still being parsed, because the kit's scripts load
     after this one. Queue it and it runs once they have. */
  function dxDefer(fn) { DX.deferred.push(fn); }

  global.DX = DX;
  global.dxSection = dxSection;
  global.dxAdd = dxAdd;
  global.dxDefer = dxDefer;
}(window));
</script>
