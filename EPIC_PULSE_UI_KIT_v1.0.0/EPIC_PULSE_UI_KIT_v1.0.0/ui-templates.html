          'demand, because an always-open textarea on an investigation screen ' +
          'reads as something you are expected to fill in before you have found ' +
          'anything.',
    files: ['ep-extended.css'],
    stage: '--stack --panel',
    html: [
      '<form class="ep-note-form" data-ep-note-form>',
      '  <label class="ep-sr-only" for="new-note">New evidence note</label>',
      '  <textarea id="new-note" placeholder="What did you find? Notes travel with the finding when it is shared."></textarea>',
      '  <div class="ep-note-form__actions">',
      '    <button class="ep-btn ep-btn--ghost ep-btn--sm" type="button">Cancel</button>',
      '    <button class="ep-btn ep-btn--primary ep-btn--sm" type="submit">Add note</button>',
      '  </div>',
      '</form>'
    ]
  });

  dxAdd('patterns', {
    id: 'state-switch',
    title: 'State switch',
    note: 'A developer control for previewing a screen’s loading, empty and ' +
          'error states without having to cause them. Keep it out of the ' +
          'production build — it is scaffolding, and a reader who finds it will ' +
          'reasonably assume the states it shows are real.',
    files: ['ep-screens.css'],
    mount: ['overlays'],
    stage: '--center --panel',
    html: [
      '<div class="ep-state-switch" role="group" aria-label="Preview state">',
      '  <span class="ep-state-switch__label">State</span>',
      '  <button class="ep-btn ep-btn--xs ep-btn--ghost ep-is-active" type="button">Ready</button>',
      '  <button class="ep-btn ep-btn--xs ep-btn--ghost" type="button">Loading</button>',
      '  <button class="ep-btn ep-btn--xs ep-btn--ghost" type="button">Empty</button>',
      '  <button class="ep-btn ep-btn--xs ep-btn--ghost" type="button">Error</button>',
      '</div>'
    ]
  });
}());
</script>

<script>
/* The renderer. It builds the contents nav and every entry from the registry,
   and DX.audit() reports what it could not do rather than leaving it to be
   noticed by eye. */
(function (global) {
  'use strict';

  var DX = global.DX;
  var REF_NOTICE_CSS = 'These rules already load from ui-kit/css/ — there is ' +
    'nothing to copy here. Shown so you can see what governs the element, and ' +
    'debug it when it looks wrong.';
  var REF_NOTICE_JS = 'This is what the kit’s script already does from ' +
    'ui-kit/js/ — there is nothing to copy here. Shown so you can see what ' +
    'drives the element, and debug it when it does not.';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }

  /* An entry's code may be a string or an array of lines. Arrays read better in
     the registry and cannot pick up a stray indent from the source file. */
  function lines(v) { return v == null ? '' : (v.join ? v.join('\n') : String(v)); }

  function flag(msg) { DX.flags.push(msg); }

  /* The page's own chrome draws from the product's icon set rather than
     carrying artwork of its own. The kit's hydration pass fills every
     [data-ep-icon] at boot, which covers everything rendered before the kit
     loads; anything built after a click is filled here, because by then it
     has. Either way there is one icon set on this page. */
  function glyph(name, size) {
    var s = el('span', 'dx-glyph');
    s.setAttribute('data-ep-icon', name);
    s.setAttribute('data-ep-icon-size', String(size));
    s.setAttribute('aria-hidden', 'true');
    var kit = global.EpicPulse;
    if (kit && kit.icon) { s.innerHTML = kit.icon(name, size); }
    return s;
  }

  function countLines(code) {
    var n = String(code).replace(/\s+$/, '').split('\n').length;
    return n + (n === 1 ? ' line' : ' lines');
  }

  /* One copy button per entry, in the tab row rather than inside the panel:
     the thing you copy, what it is worth and the tab that names it belong on
     one line. It carries whichever tab is selected, and it is not there at all
     while a reference-only tab is showing — there is nothing to copy from
     those. */
  /* Tab-panel ids are counted, not drawn at random. The page renders a few
     hundred of them and a random suffix collides eventually — which it did,
     caught by the duplicate-id check as a failure that would not have
     reproduced on the next run. A counter cannot collide, and it makes the
     rendered page identical between loads. */
  var tabSeq = 0;

  function addTab(tabs, panels, label, code, copyable, notice) {
    var id = 'dx-tab-' + (++tabSeq);
    var tab = el('button', 'dx-tab' + (copyable ? '' : ' dx-tab--ref'), label);
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', 'false');
    tab.setAttribute('aria-controls', id);
    tab.title = copyable
      ? 'Copy this — it belongs in your page'
      : 'Reference only — it already loads from ui-kit/, do not paste it';
    tab.dxCode = code;
    tab.dxCopyable = copyable;
    tab.dxLabel = label;

    var panel = el('div', 'dx-panel');
    panel.id = id;
    panel.setAttribute('role', 'tabpanel');

    if (!copyable) {
      var bar = el('div', 'dx-panel__bar');
      var msg = el('p', 'dx-notice');
      msg.appendChild(el('b', null, 'Reference only. '));
      msg.appendChild(el('span', null, notice));
      bar.appendChild(msg);
      panel.appendChild(bar);
    }

    var pre = el('pre', 'dx-code');
    /* a snippet scrolls sideways, and a region that scrolls has to be
       reachable by keyboard or its overflow is unreadable without a mouse */
    pre.tabIndex = 0;
    pre.setAttribute('role', 'region');
    pre.setAttribute('aria-label', label + ' snippet');
    pre.appendChild(el('code', null, code));
    panel.appendChild(pre);

    tab.addEventListener('click', function () { select(tabs, panels, tab, panel); });
    (tabs.querySelector('.dx-tabs__list') || tabs).appendChild(tab);
    panels.appendChild(panel);
    return { tab: tab, panel: panel, copyable: copyable };
  }

  function select(tabs, panels, tab, panel) {
    var i, all = tabs.querySelectorAll('.dx-tab');
    for (i = 0; i < all.length; i++) { all[i].setAttribute('aria-selected', 'false'); }
    for (i = 0; i < panels.children.length; i++) { panels.children[i].removeAttribute('data-dx-open'); }
    tab.setAttribute('aria-selected', 'true');
    panel.setAttribute('data-dx-open', '');

    var meter = tabs.querySelector('.dx-lines');
    if (meter) { meter.textContent = countLines(tab.dxCode); }

    var btn = tabs.querySelector('.dx-copy');
    if (!btn) { return; }
    btn.hidden = !tab.dxCopyable;
    btn.classList.remove('dx-copy--done');
    btn.innerHTML = '';
    btn.appendChild(glyph('duplicate', 13));
    btn.appendChild(el('span', null, 'Copy ' + tab.dxLabel));
    btn.dxCode = tab.dxCode;
    btn.dxLabel = tab.dxLabel;
  }

  function copy(text, btn) {
    var done = function () {
      btn.classList.add('dx-copy--done');
      btn.innerHTML = '';
      btn.appendChild(glyph('check-thick', 13));
      btn.appendChild(el('span', null, 'Copied'));
      global.setTimeout(function () {
        btn.classList.remove('dx-copy--done');
        btn.innerHTML = '';
        btn.appendChild(glyph('duplicate', 13));
        btn.appendChild(el('span', null, 'Copy ' + btn.dxLabel));
      }, 1400);
    };
    if (global.navigator && global.navigator.clipboard && global.navigator.clipboard.writeText) {
      global.navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }

  /* file:// and any page without a secure context has no clipboard API, and
     this page is meant to open from a folder. */
  function fallback(text, done) {
    var ta = el('textarea');
    ta.value = text;
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* nothing else to try */ }
    document.body.removeChild(ta);
  }

  var SPECIMENS = {
    icons: function (stage) {
      dxDefer(function () {
        var kit = global.EpicPulse;
        if (!kit || !kit.icon || !kit.icon.names) { flag('icons: the icon set did not load'); return; }
        var wrap = el('div', 'dx-specimens');
        kit.icon.names().forEach(function (name) {
          var cell = el('div', 'dx-specimen');
          var art = el('div');
          art.innerHTML = kit.icon(name, 22);
          cell.appendChild(art);
          cell.appendChild(el('span', 'dx-specimen__name', name));
          wrap.appendChild(cell);
        });
        stage.appendChild(wrap);
      });
    },
    tokens: function (stage, data) {
      var wrap = el('div', 'dx-specimens');
      (data || []).forEach(function (row) {
        var cell = el('div', 'dx-specimen');
        var sw = el('div', 'dx-specimen__swatch');
        sw.style.background = 'var(' + row + ')';
        cell.appendChild(sw);
        cell.appendChild(el('span', 'dx-specimen__name', row.replace('--ep-', '')));
        wrap.appendChild(cell);
      });
      stage.appendChild(wrap);
    },
    scale: function (stage, data) {
      var wrap = el('div', 'dx-scale');
      (data || []).forEach(function (row) {
        var line = el('div', 'dx-scale__row');
        line.appendChild(el('span', 'dx-scale__name', row[0]));
        var sample = el('span', 'dx-scale__sample', row[2] || 'Every screen renders in Exo');
        sample.style.cssText = row[1];
        line.appendChild(sample);
        wrap.appendChild(line);
      });
      stage.appendChild(wrap);
    },
    boxes: function (stage, data) {
      var wrap = el('div', 'dx-specimens');
      (data || []).forEach(function (row) {
        var cell = el('div', 'dx-specimen');
        var box = el('div', 'dx-specimen__box');
        box.style.cssText = row[1];
        cell.appendChild(box);
        cell.appendChild(el('span', 'dx-specimen__name', row[0]));
        wrap.appendChild(cell);
      });
      stage.appendChild(wrap);
    },
    swatches: function (stage, data) {
      var wrap = el('div', 'dx-specimens');
      (data || []).forEach(function (token) {
        var cell = el('div', 'dx-specimen');
        var sw = el('div', 'dx-specimen__swatch');
        sw.style.background = 'var(' + token + ')';
        cell.appendChild(sw);
        cell.appendChild(el('span', 'dx-specimen__name', token));
        wrap.appendChild(cell);
      });
      stage.appendChild(wrap);
    }
  };

  /* What Launch is for: a surface that resolves against the VIEWPORT and is
     therefore shown smaller than it opens. An anchored surface — a popover, a
     menu — is already at its real size in the card, so offering to open it
     "properly" would move it somewhere it never appears. */
  var DIALOG_SEL = '.ep-scrim, .ep-modal, .ep-drawer, .ep-assistant';
  /* Attributes whose value is an id. The ARIA ones are obvious; data-ep-reveal
     is the kit's own, and leaving it out meant the id was suffixed while the
     hook still named the original — the page renamed the target out from under
     the control that was looking for it. */
  var ID_REFS = ['for', 'aria-controls', 'aria-describedby', 'aria-labelledby',
                 'aria-owns', 'list', 'form', 'data-ep-reveal'];

  /* An id that is fine on one screen collides the moment this page renders
     sign-in and settings into the same document. Every id and every reference
     to it is suffixed with the entry id. This runs AFTER the snippet has been
     captured, so what a reader copies keeps the plain ids — the collision is
     this page's problem, not theirs. */
  function uniquifyIds(host, entryId) {
    var map = {}, i, j;
    var withId = host.querySelectorAll('[id]');
    for (i = 0; i < withId.length; i++) {
      var was = withId[i].id;
      map[was] = was + '-' + entryId;
      withId[i].id = map[was];
    }
    if (!withId.length) { return 0; }
    for (i = 0; i < ID_REFS.length; i++) {
      var refs = host.querySelectorAll('[' + ID_REFS[i] + ']');
      for (j = 0; j < refs.length; j++) {
        var v = refs[j].getAttribute(ID_REFS[i]);
        if (map[v]) { refs[j].setAttribute(ID_REFS[i], map[v]); }
      }
    }
    var anchors = host.querySelectorAll('a[href^="#"]');
    for (i = 0; i < anchors.length; i++) {
      var target = anchors[i].getAttribute('href').slice(1);
      if (map[target]) { anchors[i].setAttribute('href', '#' + map[target]); }
    }
    return withId.length;
  }

  /* Marked while everything is still in the stage, so a trigger that lives
     inside a dialog is not missed once the dialog has been moved out. */
  function markTriggers(host) {
    /* Only the controls that open something over the page. A menu trigger
       opens an anchored panel and already carries its own caret, so marking it
       gave every dropdown on the page two glyphs — one saying "this opens a
       list" and one saying "this leaves the card", and only the first is
       true. Same line as Launch draws: viewport surfaces, not anchored ones.

       And only where there is a label to annotate. The mark is a note appended
       to text; on an icon-only control there is no text and it lands beside
       the glyph as a second glyph — which on a 52px disc is the whole of what
       the control looks like.

       Emptiness is the wrong test for that, though: .ep-icon-btn--mark holds
       the two-letter workspace mark, so it reads as labelled and took the
       glyph anyway — an OP disc with an arrow wedged in beside it. The rule
       is the shape of the control, not whether a string happens to be in it,
       so every .ep-icon-btn is skipped whatever it contains. */
    var t = host.querySelectorAll('[data-ep-open], [data-ep-scrim-open]');
    var n = 0;
    for (var i = 0; i < t.length; i++) {
      if (!t[i].textContent.replace(/\s+/g, '')) { continue; }
      if (t[i].classList.contains('ep-icon-btn')) { continue; }
      t[i].classList.add('dx-trigger');
      n++;
    }
    return n;
  }

  /* A dialog that stays inside its card opens at card size, and every
     judgement made about it is wrong. Closed panels move to the body so Launch
     opens them the size they really are. A panel rendered already open is a
     specimen of its own anatomy and stays where it can be looked at.

     `zones` is the set of containers whose own children count as top level —
     the host for a plain entry, one per band for a grouped one. A scrim nested
     deeper than that belongs to a screen assembly and is left where it is. */
  function relocate(zones, node) {
    var moved = [], z, i;
    for (z = 0; z < zones.length; z++) {
      var kids = zones[z].children;
      for (i = kids.length - 1; i >= 0; i--) {
        var child = kids[i];
        if (child.classList && child.classList.contains('ep-scrim') &&
            !child.classList.contains('ep-is-open')) {
          moved.push(child);
        }
      }
    }
    moved.reverse();
    for (i = 0; i < moved.length; i++) { document.body.appendChild(moved[i]); }
    node.dxPanels = moved;
    return moved.length;
  }

  /* What a Launch button opens: every panel that was moved out, and otherwise
     whatever dialog-ish elements the entry renders inline. A specimen laid out
     in the flow is readable but not full size — a dialog is judged at the size
     it really opens, so it gets a Launch as well. That is what "detected, not
     declared" means. */
  function launchTargets(host, node, zones) {
    if (node.dxPanels && node.dxPanels.length) { return node.dxPanels.slice(); }
    var i, z, out = [], outer = '.ep-scrim, .ep-drawer, .ep-assistant';
    /* Top level means the host for a plain entry and each band for a grouped
       one. Scanning only the host would find the first band and stop, which is
       how an entry carrying three specimens ends up offering one button. */
    var roots = (zones && zones.length) ? zones : [host];
    for (z = 0; z < roots.length; z++) {
      for (i = 0; i < roots[z].children.length; i++) {
        if (roots[z].children[i].matches && roots[z].children[i].matches(outer)) {
          out.push(roots[z].children[i]);
        }
      }
    }
    if (out.length) { return out; }
    var one = host.querySelector(DIALOG_SEL);
    return one ? [one] : [];
  }

  /* What the button beside "Launch" says when an entry carries more than one
     dialog. The panel's own accessible name first, because that is what the
     reader will see once it opens; the hook it answers to second. */
  function panelName(target) {
    var dialog = target.querySelector ? target.querySelector('[role="dialog"]') : null;
    var name = dialog && (dialog.getAttribute('aria-label') ||
      (dialog.querySelector('.ep-modal__title, .ep-drawer__head .ep-t-bold') || {}).textContent);
    if (!name && target.getAttribute) { name = target.getAttribute('data-ep-scrim'); }
    name = (name || '').trim().replace(/\s+/g, ' ');
    return name.length > 26 ? name.slice(0, 25) + '…' : name;
  }

  function openPanel(node, target, opener) {
    if (node.dxLaunchName && global.EpicPulse && global.EpicPulse.overlays) {
      global.EpicPulse.overlays.open(node.dxLaunchName, opener);
      return;
    }
    if (!target) { return; }
    closePanel();
    /* The kit holds one open panel of its own. Where an entry's triggers and
       its Launch buttons both reach the same panels, whichever opened last
       has to be the only one showing. */
    if (global.EpicPulse && global.EpicPulse.overlays) { global.EpicPulse.overlays.close(); }

    /* An inline specimen is lifted out of its card for as long as it is open,
       which is the only way it can resolve against the viewport the way it
       does in the application. Where it came from is remembered so it goes
       back to the same place. */
    if (target.parentNode !== document.body) {
      DX.restore = { el: target, parent: target.parentNode, next: target.nextSibling };
      document.body.appendChild(target);
    }
    target.classList.add('ep-is-open');
    DX.openScrim = target;
    var panel = target.querySelector('[role="dialog"]') || target;
    if (global.EpicPulse && global.EpicPulse.dialog && panel) {
      global.EpicPulse.dialog.trap(panel, opener);
    }
  }

  function closePanel() {
    if (!DX.openScrim) { return; }
    DX.openScrim.classList.remove('ep-is-open');
    if (DX.restore && DX.restore.el === DX.openScrim) {
      DX.restore.parent.insertBefore(DX.restore.el, DX.restore.next);
      DX.openScrim.classList.add('ep-is-open');   /* it was a specimen: leave it as it was */
      DX.restore = null;
    }
    DX.openScrim = null;
    if (global.EpicPulse && global.EpicPulse.dialog) { global.EpicPulse.dialog.release(); }
  }

  /* Several variants of one element, banded and captioned, so an entry can
     answer "which of these is which" without a reader counting positions.
     The caption is drawn as page furniture AND carried into the snippet as a
     comment, which is what keeps the two halves of the entry saying the same
     thing while no dx- class ever reaches something copyable. */
  function bandSource(group) {
    var head = group.caption ? '<!-- ' + group.caption +
      (group.hint ? ' — ' + group.hint : '') + ' -->\n' : '';
    return head + lines(group.html);
  }

  function renderGroups(stage, entry) {
    var wrap = el('div', 'dx-groups');
    var zones = [], rendered = [];
    entry.groups.forEach(function (group) {
      var band = el('div', 'dx-group');
      if (group.caption) {
        var cap = el('div', 'dx-caption');
        cap.appendChild(el('span', null, group.caption));
        if (group.hint) { cap.appendChild(el('span', 'dx-caption__hint', group.hint)); }
        band.appendChild(cap);
      }
      var body = el('div', 'dx-group__body dx-group__body--' + (group.body || 'row'));
      if (group.bodyStyle) { body.style.cssText = group.bodyStyle; }
      /* Page furniture, on the band rather than in it: a component whose
         subject is movement cannot be shown standing still, and the marker
         that drives it must not reach the markup a reader copies. */
      if (group.demo) { body.setAttribute('data-dx-demo', group.demo); }
      body.innerHTML = bandSource(group);
      rendered.push(body.innerHTML);
      zones.push(body);
      band.appendChild(body);
      wrap.appendChild(band);
    });
    stage.appendChild(wrap);
    return { host: wrap, zones: zones, snippet: entry.groups.map(bandSource).join('\n\n'),
             rendered: rendered.join('\n\n') };
  }

  /* A band that declared nothing but dialogs is empty once they have been
     moved out, and an empty captioned band reads as a broken entry rather
     than as the point being made. Page furniture, added after the snippet
     has been taken, so it is never part of what a reader copies. */
  function noteRelocated(zones) {
    for (var i = 0; i < zones.length; i++) {
      if (!zones[i].querySelector('*')) {
        zones[i].appendChild(el('p', 'dx-empty',
          'Declared here, and moved to the end of the document so it opens at ' +
          'the size it really is. Use the row above, or a Launch button.'));
      }
    }
  }

  /* One entry shows the shell the kit renders rather than a copy of it. The
     shell resolves its region from the first [data-ep-shell] on the page, and
     every stage carries that marker so previews cannot drive one another, so
     the marker is narrowed to this one stage for the length of the call and
     put back afterwards. */
  function bootShellInto(entryId) {
    var kit = global.EpicPulse;
    var stage = document.querySelector('[data-dx-stage="' + entryId + '"]');
    if (!stage || !kit || !kit.shell || !kit.shell.boot) {
      flag('shell: could not render into "' + entryId + '"');
      return;
    }
    var marked = document.querySelectorAll('[data-dx-stage][data-ep-shell]');
    var i;
    for (i = 0; i < marked.length; i++) { marked[i].removeAttribute('data-ep-shell'); }
    stage.setAttribute('data-ep-shell', '');
    try { kit.shell.boot(); } catch (err) { flag('shell: ' + err.message); }
    /* The shell emits ids of its own, and an id that is fine on a screen
       collides here the same way an entry's does — this page already carries
       an anchor called "sidebar". Same policy, applied after the fact because
       these ids did not exist when the entry was rendered. */
    uniquifyIds(stage, entryId);
    for (i = 0; i < marked.length; i++) { marked[i].setAttribute('data-ep-shell', ''); }
    stage.setAttribute('data-ep-shell', '');
  }

  function renderEntry(entry, section) {
    var node = el('article', 'dx-entry');
    node.id = entry.id;
    node.setAttribute('data-dx-entry', entry.id);
    node.setAttribute('data-dx-search',
      (entry.id + ' ' + (entry.title || '') + ' ' +
       lines(entry.html) + ' ' +
       (entry.groups || []).map(bandSource).join(' ')).toLowerCase());

    var head = el('div', 'dx-entry__head');
    var headRow = el('div', 'dx-entry__headrow');
    var idBox = el('div', 'dx-entry__id');
    idBox.appendChild(el('h3', 'dx-entry__title', entry.title || entry.id));
    headRow.appendChild(idBox);

    var actions = el('div', 'dx-entry__actions');
    if ((entry.files && entry.files.length) || (entry.mount && entry.mount.length)) {
      var files = el('div', 'dx-files');
      /* mounts first: a reader who has not put the mount in the page will not
         get this component at all, which outranks knowing which file styles it */
      (entry.mount || []).forEach(function (m) {
        files.appendChild(el('span', 'dx-file dx-file--mount', 'data-ep-mount="' + m + '"'));
      });
      (entry.files || []).forEach(function (f) { files.appendChild(el('span', 'dx-file', f)); });
      actions.appendChild(files);
    }
    headRow.appendChild(actions);
    head.appendChild(headRow);
    /* the note sits under BOTH, so its measure is the card's rather than
       whatever width the chips happened to leave */
    if (entry.note) { head.appendChild(el('p', 'dx-entry__note', entry.note)); }
    node.appendChild(head);

    var stage = el('div', 'dx-stage');
    (entry.stage || '').split(/\s+/).forEach(function (m) {
      if (m) { stage.classList.add('dx-stage' + m); }
    });
    if (entry.stageStyle) { stage.style.cssText = entry.stageStyle; }
    stage.setAttribute('data-dx-stage', entry.id);

    if (entry.scenery) {
      var sc = el('div', 'dx-stage__scenery');
      sc.innerHTML = lines(entry.scenery);
      stage.appendChild(sc);
    }

    var html = lines(entry.html);
    var snippet = html;
    if (entry.kind) {
      if (SPECIMENS[entry.kind]) { SPECIMENS[entry.kind](stage, entry.data); }
      else { flag(entry.id + ': no specimen generator for kind "' + entry.kind + '"'); }
    } else if (entry.groups && entry.groups.length) {
      /* Banded variants. Each band's markup is its own string, and the tab is
         those strings in the order they are shown — so the preview and the
         snippet still come from one value per band. */
      var built = renderGroups(stage, entry);
      snippet = built.snippet;
      node.dxRendered = built.rendered;
      uniquifyIds(built.host, entry.id);
      markTriggers(built.host);
      node.dxLaunchable = !!built.host.querySelector(DIALOG_SEL);
      node.dxLaunchName = entry.launch || null;
      relocate(built.zones, node);
      noteRelocated(built.zones);
      node.dxTargets = launchTargets(built.host, node, built.zones);
    } else if (html) {
      /* One string, rendered AND shown. Wanting to render one thing and show
         another means the component has a problem, not the documentation.
         The snapshot is taken here, before the kit's scripts have touched
         anything, so the audit can compare what was rendered against what is
         shown without the kit's own DOM work reading as a difference. */
      var host = el('div');
      host.style.cssText = 'display:contents';
      host.innerHTML = html;
      node.dxRendered = host.innerHTML;
      uniquifyIds(host, entry.id);
      markTriggers(host);
      node.dxLaunchable = !!host.querySelector(DIALOG_SEL);
      node.dxLaunchName = entry.launch || null;
      relocate([host], node);
      node.dxTargets = launchTargets(host, node);
      stage.appendChild(host);
    } else if (entry.preview) {
      var pv = el('div');
      pv.innerHTML = lines(entry.preview);
      stage.appendChild(pv);
    } else {
      stage.appendChild(el('div', 'dx-empty', 'This entry has no preview yet.'));
      flag(entry.id + ': nothing to render — no html, groups, preview or kind');
    }
    node.dxTargets = node.dxTargets || [];
    node.dxTarget = node.dxTargets[0] || null;
    node.appendChild(stage);

    if (entry.boot === 'shell') { DX.shellBoot = entry.id; }

    /* Detected, not declared, so a new dialog entry cannot forget to offer
       one — and one button per dialog, because on an entry carrying four of
       them a single Launch silently means "the first". An entry naming a kit
       overlay hands the opening to the kit's own script; anything else is
       opened here against the panel that was moved out, with the kit's real
       focus trap either way. */
    if (node.dxLaunchable && (node.dxLaunchName || node.dxTargets.length)) {
      var bar = el('div', 'dx-launches');
      var targets = node.dxLaunchName ? [null] : node.dxTargets;
      targets.forEach(function (target, i) {
        var label = 'Launch';
        if (targets.length > 1) {
          var name = panelName(target);
          label = name ? 'Launch · ' + name : 'Launch ' + (i + 1);
        }
        var launch = el('button', 'dx-launch');
        launch.type = 'button';
        launch.appendChild(el('span', null, label));
        launch.title = 'Open this at the size it really is, out of the card';
        launch.addEventListener('click', function () { openPanel(node, target, launch); });
        bar.appendChild(launch);
      });
      actions.insertBefore(bar, actions.firstChild);
    }

    var block = el('div', 'dx-code-block');
    var tabs = el('div', 'dx-tabs');
    var tabList = el('div', 'dx-tabs__list');
    tabList.setAttribute('role', 'tablist');
    tabs.appendChild(tabList);
    var tabEnd = el('span', 'dx-tabs__end');
    tabEnd.appendChild(el('span', 'dx-lines'));
    var copyBtn = el('button', 'dx-copy');
    copyBtn.type = 'button';
    copyBtn.hidden = true;
    copyBtn.appendChild(glyph('duplicate', 13));
    copyBtn.appendChild(el('span', null, 'Copy'));
    copyBtn.addEventListener('click', function () { copy(copyBtn.dxCode, copyBtn); });
    tabEnd.appendChild(copyBtn);
    tabs.appendChild(tabEnd);
    var panels = el('div');
    var made = [];

    if (snippet) { made.push(addTab(tabs, panels, 'HTML', snippet, true)); }
    if (entry.alt && entry.alt.code) {
      made.push(addTab(tabs, panels, entry.alt.label || 'Alternative', lines(entry.alt.code), true));
    }
    if (entry.jsPage) { made.push(addTab(tabs, panels, 'JS', lines(entry.jsPage), true)); }
    if (entry.css) { made.push(addTab(tabs, panels, 'CSS-reference', lines(entry.css), false, REF_NOTICE_CSS)); }
    if (entry.js) { made.push(addTab(tabs, panels, 'JS-reference', lines(entry.js), false, REF_NOTICE_JS)); }

    if (made.length) {
      block.appendChild(tabs);
      block.appendChild(panels);
      node.appendChild(block);
      select(tabs, panels, made[0].tab, made[0].panel);
    } else {
      flag(entry.id + ': no code tab at all');
    }

    section.appendChild(node);
    return node;
  }

  function render() {
    var main = document.querySelector('[data-dx-main]');
    var nav = document.querySelector('[data-dx-nav]');

    if (DX.lede) {
      var lede = el('div', 'dx-lede');
      lede.innerHTML = lines(DX.lede);
      main.appendChild(lede);
    }

    DX.sections.forEach(function (s, i) {
      var sec = el('section', 'dx-section');
      sec.id = s.id;
      sec.setAttribute('data-dx-section', s.id);
      var sh = el('div', 'dx-section__head');
      sh.appendChild(el('span', 'dx-section__num', String(i + 1)));
      sh.appendChild(el('h2', 'dx-section__title', s.title));
      if (s.note) { sh.appendChild(el('p', 'dx-section__note', s.note)); }
      sec.appendChild(sh);

      s.entries.forEach(function (entry) { renderEntry(entry, sec); });
      if (!s.entries.length) {
        sec.appendChild(el('div', 'dx-empty', 'No entries in this section yet.'));
      }
      main.appendChild(sec);

      var link = el('a');
      link.href = '#' + s.id;
      link.appendChild(el('span', null, s.title));
      link.appendChild(el('span', 'dx-side__count', String(s.entries.length)));
      link.setAttribute('data-dx-nav-count', String(s.entries.length));
      link.setAttribute('data-dx-nav-for', s.id);
      nav.appendChild(link);
    });
  }

  /* The contents list follows the scroll rather than the last link clicked.
     Ten sections is more than fits a screen, and a reader who arrived by
     scrolling has no other way to see where they are.

     Deliberately not an IntersectionObserver: a section here is taller than
     the viewport, so for most of the page NONE of them intersects a band
     narrow enough to pick one — the mark would simply stop moving. What is
     wanted is "the last section whose head has gone past", which is a
     comparison, not an intersection. */
  /* Reference-page chrome, not kit behaviour. A progress bar is the one
     component that is wrong when it is still: the entry's own note says a bar
     that never moves is worse than no bar, so the preview must not be one.
     What the kit does with the same markup is on the JS tab — it advances the
     fill and the readout together and hands over to a finished toast. */
  function runDemos() {
    var bands = document.querySelectorAll('[data-dx-demo="progress"]');
    for (var i = 0; i < bands.length; i++) { advance(bands[i]); }
  }

  function advance(band) {
    var fill = band.querySelector('.ep-progress__fill');
    var bar = band.querySelector('[role="progressbar"]');
    if (!fill) { return; }
    var readout = null, all = band.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      if (!all[i].children.length && /^\d+%$/.test(all[i].textContent.trim())) { readout = all[i]; }
    }
    var pct = parseInt(fill.style.width, 10) || 0;
    global.setInterval(function () {
      pct = pct >= 100 ? 0 : Math.min(100, pct + 4);
      fill.style.width = pct + '%';
      if (bar) { bar.setAttribute('aria-valuenow', String(pct)); }
      if (readout) { readout.textContent = pct + '%'; }
    }, 320);
  }

  function wireSpy() {
    var links = [], all = document.querySelectorAll('[data-dx-nav-for]');
    for (var i = 0; i < all.length; i++) {
      links.push({ id: all[i].getAttribute('data-dx-nav-for'), el: all[i] });
    }
    if (!links.length) { return; }

    var pending = false;
    function paint() {
      pending = false;
      var current = links[0].id;
      for (var j = 0; j < links.length; j++) {
        var sec = document.getElementById(links[j].id);
        if (sec && !sec.hidden && sec.getBoundingClientRect().top <= 120) { current = links[j].id; }
      }
      for (var k = 0; k < links.length; k++) {
        links[k].el.setAttribute('aria-current', String(links[k].id === current));
      }
    }
    function schedule() {
      if (pending) { return; }
      pending = true;
      (global.requestAnimationFrame || global.setTimeout)(paint);
    }
    global.addEventListener('scroll', schedule, { passive: true });
    global.addEventListener('resize', schedule);
    paint();
  }

  /* Every rendered theme switch on the page shows the same preference,
     whichever control changed it. */
  function syncThemeSwitches() {
    var kit = global.EpicPulse;
    if (!kit || !kit.theme) { return; }
    var pref = kit.theme.pref();
    var all = document.querySelectorAll('[data-ep-theme-set]');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.toggle('ep-is-active', all[i].getAttribute('data-ep-theme-set') === pref);
    }
  }

  function wireFilter() {
    var input = document.getElementById('dx-filter');
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      var entries = document.querySelectorAll('[data-dx-entry]');
      var i, shown = {};
      for (i = 0; i < entries.length; i++) {
        var hit = !q || entries[i].getAttribute('data-dx-search').indexOf(q) !== -1;
        entries[i].hidden = !hit;
        if (hit) { shown[entries[i].closest('.dx-section').id] = 1; }
      }
      var secs = document.querySelectorAll('.dx-section');
      for (i = 0; i < secs.length; i++) { secs[i].hidden = !!q && !shown[secs[i].id]; }
    });
  }

  function wireTheme() {
    var buttons = document.querySelectorAll('[data-dx-theme]');
    function paint() {
      var pref = global.EpicPulse && global.EpicPulse.theme ? global.EpicPulse.theme.pref() : null;
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute('aria-pressed',
          String(buttons[i].getAttribute('data-dx-theme') === pref));
      }
    }
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function (ev) {
        var kit = global.EpicPulse;
        if (kit && kit.theme) { kit.theme.set(ev.currentTarget.getAttribute('data-dx-theme')); }
        paint();
      });
    }
    dxDefer(function () {
      paint();
      syncThemeSwitches();
      var kit = global.EpicPulse;
      if (kit && kit.theme && kit.theme.onChange) {
        kit.theme.onChange(function () { paint(); syncThemeSwitches(); });
      }
    });
  }

  /* What the eye cannot check: a stage whose modifier did not take effect, a
     fixed component that escaped its card, a copy button on a reference tab,
     dx- leaking into something copyable. */
  /* Every class name the kit's stylesheets define. Read from the live sheets
     rather than a list, so it is whatever shipped. */
  function kitClasses() {
    var set = {}, i, j, sheets = document.styleSheets, any = false;
    for (i = 0; i < sheets.length; i++) {
      var href = sheets[i].href || '';
      if (href.indexOf('ui-kit/css/') === -1) { continue; }
      var rules;
      try { rules = sheets[i].cssRules; } catch (e) { return null; }
      if (!rules) { continue; }
      any = true;
      collect(rules, set);
    }
    return any ? set : null;
  }

  function collect(rules, set) {
    for (var j = 0; j < rules.length; j++) {
      var rule = rules[j];
      if (rule.selectorText) {
        var m = rule.selectorText.match(/\.[A-Za-z0-9_-]+/g) || [];
        for (var k = 0; k < m.length; k++) { set[m[k].slice(1)] = 1; }
      }
      if (rule.cssRules) { collect(rule.cssRules, set); }
    }
  }

  DX.audit = function () {
    var out = { flags: DX.flags.slice(), entries: 0, stages: [], contained: [],
                leaks: [], tabs: [], oneString: [], bands: [] };
    var CHROME = ['.ep-sidebar', '.ep-sidebar__backdrop', '.ep-topbar', '.ep-scrim', '.ep-drawer',
                  '.ep-assistant', '.ep-fab-dock', '.ep-toast-dock', '.ep-popover-layer', '.ep-menu-layer'];

    var entries = document.querySelectorAll('[data-dx-entry]');
    out.entries = entries.length;

    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var id = e.getAttribute('data-dx-entry');
      var stage = e.querySelector('[data-dx-stage]');

      if (stage) {
        var cs = global.getComputedStyle(stage);
        /* --center on a block container does nothing: justify-content has no
           effect outside a flex or grid context, so the modifier is silently
           ignored and the preview renders top-left. Checked rather than
           trusted, because nothing about it looks wrong. */
        if (stage.classList.contains('dx-stage--center') && cs.display.indexOf('flex') === -1) {
          out.stages.push({ id: id, problem: '--center on a ' + cs.display + ' stage does nothing' });
        }
        if (stage.classList.contains('dx-stage--block') && stage.classList.contains('dx-stage--center')) {
          out.stages.push({ id: id, problem: '--block and --center contradict each other' });
        }
        if (!stage.querySelector('*')) { out.stages.push({ id: id, problem: 'empty stage' }); }

        /* A preview that renders nothing, or spills out of its card, is
           invisible to every other check here: the markup is valid, the
           classes exist, the snippet matches. Only the geometry says so. */
        var box = stage.getBoundingClientRect(), bottom = box.top, seen = 0;
        var inside = stage.querySelectorAll('*');
        for (var g = 0; g < inside.length; g++) {
          var gb = inside[g].getBoundingClientRect();
          if (gb.width > 0 && gb.height > 0) { seen++; bottom = Math.max(bottom, gb.bottom); }
        }
        if (!seen) { out.stages.push({ id: id, problem: 'nothing is visible in the stage' }); }
        else if (bottom - box.top > box.height + 10) {
          out.stages.push({ id: id, problem: 'content overflows the stage by ' +
                            Math.round(bottom - box.top - box.height) + 'px' });
        }

        /* Sideways too. Only the vertical case was measured, and a component
           whose width resolves against the wrong box runs off the right edge
           without ever making the card taller.

           Asked of the stage rather than of every descendant: a slider track
           is wider than its frame on purpose and clipped by it, and walking
           rectangles cannot see that it was clipped. scrollWidth only grows
           for content the stage itself has to scroll. --popper stages are
           skipped because they release the clip deliberately. */
        if (!stage.classList.contains('dx-stage--popper') &&
            stage.scrollWidth - stage.clientWidth > 10) {
          out.stages.push({ id: id, problem: 'content overflows the stage sideways by ' +
                            (stage.scrollWidth - stage.clientWidth) + 'px' });
        }

        for (var c = 0; c < CHROME.length; c++) {
          var found = stage.querySelectorAll(CHROME[c]);
          for (var f = 0; f < found.length; f++) {
            var pos = global.getComputedStyle(found[f]).position;
            out.contained.push({ id: id, sel: CHROME[c], position: pos, ok: pos !== 'fixed' });
          }
        }

        /* A band with no caption is an unlabelled row of variants, which is
           the thing banding exists to stop. */
        var caps = stage.querySelectorAll('.dx-group');
        for (var bq = 0; bq < caps.length; bq++) {
          var capEl = caps[bq].querySelector('.dx-caption');
          out.bands.push({ id: id, captioned: !!(capEl && capEl.textContent.trim()),
                           filled: !!caps[bq].querySelector('.dx-group__body *') });
        }
      }

      /* The preview and the snippet come from one value. Both sides are put
         through the same parser before comparing, so attribute quoting and
         tag normalisation cannot read as a disagreement. */
      if (e.dxRendered != null) {
        var shownTab = null, tt = e.querySelectorAll('.dx-tab');
        for (var t = 0; t < tt.length; t++) {
          if (tt[t].textContent === 'HTML') { shownTab = tt[t]; break; }
        }
        if (!shownTab) {
          out.oneString.push({ id: id, problem: 'rendered from html but no HTML tab' });
        } else {
          var probe = document.createElement('div');
          probe.innerHTML = document.getElementById(
            shownTab.getAttribute('aria-controls')).querySelector('code').textContent;
          out.oneString.push({ id: id, match: probe.innerHTML === e.dxRendered });
        }
      }

      /* dx- must never appear in anything copyable */
      /* Copy now lives in the tab row and carries whichever tab is selected,
         so what a tab is worth is read off the tab rather than the panel. */
      var tabEls = e.querySelectorAll('.dx-tab');
      for (var p = 0; p < tabEls.length; p++) {
        var copyable = !tabEls[p].classList.contains('dx-tab--ref');
        var body = document.getElementById(tabEls[p].getAttribute('aria-controls'));
        var noticeEl = body && body.querySelector('.dx-notice');
        var text = body ? body.querySelector('code').textContent : '';
        out.tabs.push({ id: id, copyable: copyable,
                        hasNotice: !!(noticeEl && noticeEl.textContent) });
        if (copyable && text.indexOf('dx-') !== -1) { out.leaks.push({ id: id, text: 'dx- in a copyable snippet' }); }
      }
    }

    /* A class the kit does not define is markup that will never look right,
       and it is invisible in a preview — the element simply renders plain.
       The rules are read from the kit's own stylesheets, so this cannot drift
       from what actually ships. */
    out.unknownClasses = [];
    var known = kitClasses();
    if (!known) {
      out.flags.push('audit: could not read the kit stylesheets, class check skipped');
    } else {
      for (var u = 0; u < entries.length; u++) {
        var uid = entries[u].getAttribute('data-dx-entry');
        var els = entries[u].querySelectorAll('[data-dx-stage] [class]');
        var bad = {};
        for (var q = 0; q < els.length; q++) {
          var cl = els[q].className;
          if (typeof cl !== 'string') { continue; }
          var parts = cl.split(/\s+/);
          for (var r = 0; r < parts.length; r++) {
            if (parts[r].indexOf('ep-') === 0 && !known[parts[r]]) { bad[parts[r]] = 1; }
          }
        }
        /* A snippet is not rendered, so nothing about it is checked by eye.
           A tab teaching a class the kit does not define is worse than a
           preview using one: the reader pastes it and it silently does
           nothing. */
        var tabsCode = entries[u].querySelectorAll('.dx-panel code');
        for (var c2 = 0; c2 < tabsCode.length; c2++) {
          var txt = tabsCode[c2].textContent;
          var inClass = txt.match(/class="[^"]*"/g) || [];
          for (var x = 0; x < inClass.length; x++) {
            var names = inClass[x].slice(7, -1).split(/\s+/);
            for (var y = 0; y < names.length; y++) {
              if (names[y].indexOf('ep-') === 0 && !known[names[y]]) { bad[names[y]] = 1; }
            }
          }
        }
        for (var name in bad) {
          if (Object.prototype.hasOwnProperty.call(bad, name)) {
            out.unknownClasses.push({ id: uid, cls: name });
          }
        }
      }
    }

    /* Every entry holding a dialog must offer a way to see each of them at
       full size, and no dialog panel may carry an inline width: at full size
       width:auto means "as wide as the longest line", and a width added to
       make a panel fit a preview makes every judgement about the wordiest
       dialogs wrong. */
    out.launch = [];
    out.inlineWidth = [];
    for (var d = 0; d < entries.length; d++) {
      var dn = entries[d];
      if (dn.dxLaunchable) {
        var offered = dn.querySelectorAll('.dx-launch').length;
        var wanted = dn.dxLaunchName ? 1 : (dn.dxTargets || []).length;
        out.launch.push({ id: dn.getAttribute('data-dx-entry'),
                          offered: offered > 0 && offered === wanted,
                          buttons: offered, dialogs: wanted,
                          relocated: (dn.dxPanels || []).length });
      }
      var panels2 = (dn.dxPanels || []);
      for (var q2 = 0; q2 < panels2.length; q2++) {
        var inner = panels2[q2].querySelectorAll('.ep-modal, .ep-drawer, .ep-popover, .ep-assistant');
        for (var w = 0; w < inner.length; w++) {
          if (inner[w].style && inner[w].style.width) {
            out.inlineWidth.push({ id: dn.getAttribute('data-dx-entry'), width: inner[w].style.width });
          }
        }
      }
    }

    /* Duplicate ids. The renderer suffixes everything it puts on the page, so
       anything left is either page chrome or emitted by the kit at runtime —
       both of which this cannot fix and both of which need to be seen. */
    out.duplicateIds = [];
    var seenIds = {}, all2 = document.querySelectorAll('[id]');
    for (var z = 0; z < all2.length; z++) {
      var theId = all2[z].id;
      if (seenIds[theId]) { out.duplicateIds.push(theId); } else { seenIds[theId] = 1; }
    }

    /* The six fences, read back rather than assumed. */
    var cfg = (global.EpicPulse && global.EpicPulse.config) || {};
    out.guards = {
      navigateReplaced: !!cfg.navigate && cfg.navigate.toString().indexOf('location.href') === -1,
      ackUnwiredOff: cfg.ackUnwired === false,
      storagePrefixed: global.EP_STORAGE_PREFIX === 'epic-pulse-docs.',
      stagesAreRegions: document.querySelectorAll('[data-dx-stage][data-ep-shell]').length ===
                        document.querySelectorAll('[data-dx-stage]').length,
      appKeysUntouched: (function () {
        try {
          for (var k = 0; k < global.localStorage.length; k++) {
            var key = global.localStorage.key(k);
            if (key.indexOf('epic-pulse.') === 0) { return false; }
          }
        } catch (e) { /* private mode — nothing was written either way */ }
        return true;
      }())
    };
    out.intents = DX.intents.slice();

    /* The notes. A note carries the rule, the constraint or the deliberate
       absence — the preview already shows what the thing looks like — and it
       is the one part of an entry nothing else checks: prose renders fine
       while saying something the kit stopped doing. Three things are
       checkable, and all three have been wrong here at least once.

       1 · An entry with no note at all.
       2 · A name a note uses that the kit does not define. The class audit
           above reads the stage and the code tabs; a class or token named in
           prose is invisible to it.
       3 · A cross-reference that points the wrong way. "the sparkline above"
           resolved to an entry below it — the titles drift as the page is
           reordered, and nothing else notices. */
    out.notes = [];
    var ordered = [];
    for (var s1 = 0; s1 < DX.sections.length; s1++) {
      for (var e1 = 0; e1 < DX.sections[s1].entries.length; e1++) {
        ordered.push(DX.sections[s1].entries[e1]);
      }
    }
    var kitNames = known || {};
    var rootStyle = global.getComputedStyle(document.documentElement);
    var files = {};
    var links = document.querySelectorAll('link[rel="stylesheet"], script[src]');
    for (var f = 0; f < links.length; f++) {
      var href = links[f].getAttribute('href') || links[f].getAttribute('src') || '';
      var base = href.split('/').pop().replace(/\.(css|js)$/, '');
      if (base) { files[base] = 1; }
    }

    for (var o = 0; o < ordered.length; o++) {
      var ent = ordered[o], text = ent.note || '';
      if (!text) { out.notes.push({ id: ent.id, problem: 'no note' }); continue; }

      /* Skipped with the class audit when the stylesheets cannot be read —
         from file:// a browser refuses cssRules, and a check with nothing to
         check against would call every name in every note undefined. */
      var names = known ? (text.match(/(?:^|[^-\w])(ep-[a-z0-9-]+)/g) || []) : [];
      for (var q3 = 0; q3 < names.length; q3++) {
        var nm = names[q3].replace(/^[^e]*/, '');
        if (!kitNames[nm] && !files[nm] && text.indexOf('data-' + nm) === -1) {
          out.notes.push({ id: ent.id, problem: 'names ' + nm + ', which the kit does not define' });
        }
      }

      var toks = text.match(/--ep-[a-z0-9-]+/g) || [];
      for (var q4 = 0; q4 < toks.length; q4++) {
        if (!rootStyle.getPropertyValue(toks[q4]).trim()) {
          out.notes.push({ id: ent.id, problem: 'names ' + toks[q4] + ', which resolves to nothing' });
        }
      }

      var hits = [];
      for (var p2 = 0; p2 < ordered.length; p2++) {
        if (p2 === o || !ordered[p2].title || ordered[p2].title.length < 9) { continue; }
        var found = text.toLowerCase().indexOf(ordered[p2].title.toLowerCase());
        if (found > -1) { hits.push({ i: p2, at: found, to: found + ordered[p2].title.length }); }
      }
      for (var p3 = 0; p3 < hits.length; p3++) {
        /* "Sparkline" sits inside "KPI with sparkline" — the shorter title is
           part of the longer reference, not a second one. */
        var swallowed = false;
        for (var p4 = 0; p4 < hits.length; p4++) {
          if (p4 !== p3 && hits[p4].at <= hits[p3].at && hits[p4].to >= hits[p3].to) { swallowed = true; }
        }
        if (swallowed) { continue; }
        var other = ordered[hits[p3].i];
        var at = hits[p3].at;
        var around = text.slice(Math.max(0, at - 40), at + other.title.length + 40).toLowerCase();
        var wants = around.indexOf(' above') > -1 ? 'above'
                  : around.indexOf(' below') > -1 ? 'below' : null;
        if (!wants) { continue; }
        var right = wants === 'above' ? hits[p3].i < o : hits[p3].i > o;
        if (!right) {
          out.notes.push({ id: ent.id, problem: 'says ' + other.title + ' is ' + wants +
                                                ', and it is not' });
        }
      }
    }

    var navs = document.querySelectorAll('[data-dx-nav-for]');
    out.nav = [];
    for (var n = 0; n < navs.length; n++) {
      var secId = navs[n].getAttribute('data-dx-nav-for');
      var real = document.querySelectorAll('#' + secId + ' [data-dx-entry]').length;
      out.nav.push({ id: secId,
                     claimed: Number(navs[n].getAttribute('data-dx-nav-count')),
                     actual: real });
    }
    return out;
  };

  /* Six fences. All of this is reference-page chrome, not kit behaviour — a
     screen built from this kit navigates, submits and persists exactly as it
     should. Here it must not, because every component is rendered into one
     document and a preview that escapes takes the page with it. */
  function guards() {
    /* 1 · The navigation seam. The only thing that stops a menu pick leaving
       the page: two of the kit's three navigation paths assign location.href
       directly, which no click listener can intercept. Reported rather than
       silently swallowed — an invisible no-op reads as a dead control. */
    if (global.EpicPulse) {
      global.EpicPulse.config = global.EpicPulse.config || {};
      global.EpicPulse.config.navigate = function (href) { intent('navigate', href); };
    }

    /* 2 · Forms. Sign-in carries a real <form>; without this the page reloads
       with the fields in the query string. */
    document.addEventListener('submit', function (ev) {
      ev.preventDefault();
      intent('submit', (ev.target && ev.target.getAttribute('action')) || 'this form');
    });

    /* 3 · Links inside a stage, swallowed in the CAPTURE phase — before the
       row's own listener sees them, because some rows navigate themselves. */
    document.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
      if (!a) { return; }
      if (!a.closest('[data-dx-stage]') && !a.closest('.ep-scrim')) { return; }
      var href = a.getAttribute('href');
      if (href && href.charAt(0) === '#') { return; }
      ev.preventDefault();
      ev.stopPropagation();
      intent('link', href);
    }, true);

    /* 4 · Instance scope. Every stage is a shell region, so the four page-wide
       behaviours resolve to their own entry instead of reaching across the
       document and driving every other preview at once. */
    var stages = document.querySelectorAll('[data-dx-stage]');
    for (var i = 0; i < stages.length; i++) { stages[i].setAttribute('data-ep-shell', ''); }

    /* 5 · The unwired-button net stays off. It is off by default in the kit;
       set here as well because a page whose own chrome is buttons would raise
       a toast on every one of them. */
    if (global.EpicPulse && global.EpicPulse.config) {
      global.EpicPulse.config.ackUnwired = false;
    }

    /* 6 · Storage is namespaced in <head>, before the theme script reads it. */

    /* The overlay delegation. EpicPulse.overlays.open/close are the kit's real
       behaviour — the class, the scroll lock, the focus trap and the popover
       placement all happen in there — but the CLICK routing that reaches them
       is installed by overlays.render(), which a page renders its own panels
       instead of calling. This page is such a page, so it supplies the routing
       and nothing else: what opens and closes is still the kit's. */
    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t.closest) { return; }
      var ov = global.EpicPulse && global.EpicPulse.overlays;
      if (!ov) { return; }
      var opener = t.closest('[data-ep-open]');
      if (opener) {
        ev.preventDefault();
        closePanel();
        ov.open(opener.getAttribute('data-ep-open'), opener);
        return;
      }
      if (t.closest('[data-ep-close]') || t.classList.contains('ep-scrim')) { ov.close(); return; }

      /* Named actions. The kit owns what each one does — these previews only
         need the click to reach it. */
      var act = t.closest('[data-ep-action]');
      if (act && ov.action) {
        ev.preventDefault();
        ov.action(act.getAttribute('data-ep-action'), act);
        return;
      }

      var deadToast = t.closest('[data-ep-close-toast]');
      if (deadToast && deadToast.closest('.ep-toast')) {
        ev.preventDefault();
        deadToast.closest('.ep-toast').remove();
        return;
      }

      var wide = t.closest('[data-ep-assistant-wide]');
      if (wide) {
        ev.preventDefault();
        var panel = wide.closest('.ep-assistant');
        if (panel) { panel.classList.toggle('ep-is-wide'); }
        return;
      }

      /* The theme switch. The preference itself is the kit's; what the page
         adds is the routing and the mark that says which one is current. */
      var themeSet = t.closest('[data-ep-theme-set]');
      if (themeSet && global.EpicPulse.theme) {
        ev.preventDefault();
        global.EpicPulse.theme.set(themeSet.getAttribute('data-ep-theme-set'));
        return;
      }
    });
    document.addEventListener('keydown', function (ev) {
      var ov = global.EpicPulse && global.EpicPulse.overlays;
      if (ev.key === 'Escape' && ov) { ov.close(); }
    });

    /* Closing a launched panel. The kit wires its own; a panel this page moved
       out of a stage is this page's to close. */
    document.addEventListener('click', function (ev) {
      if (!DX.openScrim) { return; }
      var t = ev.target;
      if (t === DX.openScrim || (t.closest && t.closest('[data-ep-close]'))) { closePanel(); }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && DX.openScrim) { closePanel(); }
    });
  }

  function stamp(sel, text) {
    var n = document.querySelector(sel);
    if (n) { n.textContent = text; }
  }

  var intentTimer = null;
  function intent(kind, what) {
    DX.intents.push({ kind: kind, target: what });
    var bar = document.querySelector('[data-dx-intent]');
    if (!bar) { return; }
    bar.innerHTML = '';
    bar.appendChild(el('b', null, kind));
    bar.appendChild(el('span', null, ' → ' + what + ' — held on this page'));
    bar.hidden = false;
    global.clearTimeout(intentTimer);
    intentTimer = global.setTimeout(function () { bar.hidden = true; }, 2600);
  }

  render();
  wireSpy();
  wireFilter();
  wireTheme();
  guards();

  /* The kit's scripts load after this one, so anything needing them waits. */
  document.addEventListener('DOMContentLoaded', function () {
    var v = global.EpicPulse && global.EpicPulse.version;
    var badge = document.querySelector('[data-dx-version]');
    if (badge && v) { badge.textContent = 'kit ' + v; }
    stamp('[data-dx-lede-version]', v ? String(v) : '—');
    stamp('[data-dx-lede-sections]', String(DX.sections.length));
    stamp('[data-dx-lede-entries]',
      String(document.querySelectorAll('[data-dx-entry]').length));
    DX.deferred.forEach(function (fn) {
      try { fn(); } catch (err) { flag('deferred: ' + err.message); }
    });
    if (DX.shellBoot) { bootShellInto(DX.shellBoot); }
    runDemos();
  });
}(window));
</script>
